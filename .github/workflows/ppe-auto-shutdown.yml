# PPE Auto-Shutdown Workflow
# ===========================
# Automatically stops the PPE deployment slot when its scheduled duration expires.
# 
# This approach uses a lightweight hourly cron job (~1 min each) instead of a
# long-running workflow that sleeps for the full duration. This avoids wasting
# GitHub Actions minutes on idle polling—a 2-hour PPE deployment now costs ~2-3 min
# of Actions time instead of 120 min.
#
# The deploy-ppe.yml workflow sets PPE_SHUTDOWN_AT (Unix timestamp) as an app setting.
# This workflow checks if the current time has passed that timestamp and stops the slot.

name: PPE Auto-Shutdown

on:
  schedule:
    # Run every hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

run-name: PPE Auto-Shutdown Check

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: azurerbac-builtinroles
  RESOURCE_GROUP: builtinroles
  PPE_SLOT: ppe

jobs:
  check-and-shutdown:
    name: Check PPE Shutdown
    runs-on: ubuntu-latest
    environment: ppe
    
    steps:
      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check and stop PPE if expired
        run: |
          # Check if PPE slot is running
          STATE=$(az webapp show --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot ${{ env.PPE_SLOT }} --query "state" -o tsv 2>/dev/null || echo "NotFound")
          
          if [ "$STATE" != "Running" ]; then
            echo "ℹ️ PPE slot is not running (state: $STATE), nothing to do"
            exit 0
          fi
          
          # Get shutdown timestamp from app settings
          SHUTDOWN_AT=$(az webapp config appsettings list \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot ${{ env.PPE_SLOT }} \
            --query "[?name=='PPE_SHUTDOWN_AT'].value | [0]" -o tsv 2>/dev/null || echo "")
          
          if [ -z "$SHUTDOWN_AT" ]; then
            echo "⚠️ PPE is running but no PPE_SHUTDOWN_AT setting found"
            echo "   Stopping slot to prevent runaway costs..."
            az webapp stop --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot ${{ env.PPE_SLOT }}
            echo "🛑 Stopped PPE slot (no shutdown time configured)"
            exit 0
          fi
          
          NOW=$(date -u +%s)
          
          if [ "$NOW" -ge "$SHUTDOWN_AT" ]; then
            if date --version >/dev/null 2>&1; then
              # GNU date: use -d with @timestamp syntax
              SCHEDULED_TIME=$(date -u -d "@$SHUTDOWN_AT" '+%Y-%m-%d %H:%M:%S UTC')
            else
              # BSD date (no --version): use -r with epoch seconds
              SCHEDULED_TIME=$(date -u -r "$SHUTDOWN_AT" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo "timestamp $SHUTDOWN_AT (UTC)")
            fi
            echo "⏰ Shutdown time reached (scheduled: $SCHEDULED_TIME)"
            
            # Stop the slot
            az webapp stop --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot ${{ env.PPE_SLOT }}
            
            # Clear the shutdown setting
            az webapp config appsettings delete \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --slot ${{ env.PPE_SLOT }} \
              --setting-names PPE_SHUTDOWN_AT \
              --output none || true
            
            echo "🛑 Stopped PPE slot"
          else
            REMAINING=$((SHUTDOWN_AT - NOW))
            REMAINING_MINUTES=$((REMAINING / 60))
            if date --version >/dev/null 2>&1; then
              # GNU date: use -d with @timestamp syntax
              SCHEDULED_TIME=$(date -u -d "@$SHUTDOWN_AT" '+%Y-%m-%d %H:%M:%S UTC')
            else
              # BSD date (no --version): use -r with epoch seconds
              SCHEDULED_TIME=$(date -u -r "$SHUTDOWN_AT" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo "timestamp $SHUTDOWN_AT (UTC)")
            fi
            echo "✅ PPE is running"
            echo "   Shutdown at: $SCHEDULED_TIME"
            echo "   Remaining: ${REMAINING_MINUTES} minutes"
          fi

      - name: Azure Logout
        if: always()
        run: az logout
