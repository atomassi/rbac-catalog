<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Prevent dark mode flash -->
  <script>
  (function() {
      var stored = localStorage.getItem('darkMode');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var hour = new Date().getHours();
      var isNight = hour >= 19 || hour < 7;
      if (stored === 'true' || (stored === null && (prefersDark || isNight))) {
          document.documentElement.classList.add('dark');
      }
  })();
  </script>
  <title>Not Found - Azure RBAC Built-in Role Definitions Monitor</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
</head>
<body class="bg-gray-100 dark:bg-slate-900 min-h-screen flex items-center justify-center transition-colors duration-200">
  <div class="text-center">
    <h1 class="text-6xl font-bold text-gray-800 dark:text-gray-100 mb-4">404</h1>
    <h2 class="text-2xl font-semibold text-gray-600 dark:text-gray-300 mb-4">Page Not Found</h2>
    <p class="text-gray-500 dark:text-gray-400 mb-8">The role you're looking for doesn't exist or has been removed.</p>
    <a href="/" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
      Back to Home
    </a>
  </div>
  
  <!-- Dark mode handler -->
  <script src="/static/js/darkmode.js"></script>
</body>
</html>
