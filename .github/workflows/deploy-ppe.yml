name: Deploy PPE

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
      duration:
        description: 'Duration to keep environment running (minutes, max 90)'
        required: true
        default: '30'
        type: choice
        options:
          - '30'
          - '60'
          - '90'

run-name: PPE Deploy - ${{ inputs.branch }} (${{ inputs.duration }}m)

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: azurerbac-builtinroles
  RESOURCE_GROUP: builtinroles
  ACR_NAME: azurerbacregistry
  ACR_LOGIN_SERVER: azurerbacregistry.azurecr.io
  IMAGE_NAME: azurerbac
  PPE_SLOT: ppe
  PPE_URL: https://azurerbac-builtinroles-ppe.azurewebsites.net

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Build and deploy to PPE
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-ppe:
    name: Deploy to PPE
    runs-on: ubuntu-latest
    environment:
      name: ppe
      url: ${{ env.PPE_URL }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Validate duration
        run: |
          DURATION="${{ inputs.duration }}"
          if [ "$DURATION" -gt 120 ]; then
            echo "::error::Duration cannot exceed 120 minutes (2 hours)"
            exit 1
          fi
          echo "✅ Duration validated: ${DURATION} minutes"

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BRANCH_SAFE=$(echo "${{ inputs.branch }}" | sed 's/[^a-zA-Z0-9]/-/g' | cut -c1-20)
          VERSION="ppe-${BRANCH_SAFE}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 PPE Version: $VERSION"

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          echo "🐳 Built and pushed: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

      - name: Deploy to PPE Slot
        uses: azure/webapps-deploy@657f0700ea5214d56a0400d8ac5e8023c963d25d  # v3.0.6
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.PPE_SLOT }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Start PPE slot
        run: |
          az webapp start --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot ${{ env.PPE_SLOT }}
          echo "🚀 Started PPE slot with image: ${{ steps.version.outputs.version }}"

      - name: Set auto-shutdown timestamp
        run: |
          SHUTDOWN_AT=$(date -u -d "+${{ inputs.duration }} minutes" +%s 2>/dev/null || date -u -v+${{ inputs.duration }}M +%s)
          az webapp config appsettings set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot ${{ env.PPE_SLOT }} \
            --settings PPE_SHUTDOWN_AT=$SHUTDOWN_AT \
            --output none
          echo "⏰ Auto-shutdown scheduled at: $(date -u -d @$SHUTDOWN_AT '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -u -r $SHUTDOWN_AT '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Wait for PPE to be ready
        run: |
          echo "⏳ Waiting for PPE to be ready (up to 15 minutes)..."
          MAX_WAIT_SECONDS=900
          POLL_INTERVAL_SECONDS=30
          WAITED_SECONDS=0
          
          while [ $WAITED_SECONDS -lt $MAX_WAIT_SECONDS ]; do
            if curl -sf "${{ env.PPE_URL }}/healthz" > /dev/null 2>&1; then
              echo "✅ PPE is ready after ${WAITED_SECONDS}s"
              exit 0
            fi
            sleep $POLL_INTERVAL_SECONDS
            WAITED_SECONDS=$((WAITED_SECONDS + POLL_INTERVAL_SECONDS))
            echo "⏳ Waiting... ${WAITED_SECONDS}s / ${MAX_WAIT_SECONDS}s"
          done
          
          echo "❌ PPE not ready after ${MAX_WAIT_SECONDS}s"
          exit 1

      - name: PPE deployment summary
        run: |
          echo "✅ PPE deployment complete!"
          echo "   Branch: ${{ inputs.branch }}"
          echo "   Version: ${{ steps.version.outputs.version }}"
          echo "   Duration: ${{ inputs.duration }} minutes"
          echo "   Auto-shutdown at: $(date -d '+${{ inputs.duration }} minutes' '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || date -v+${{ inputs.duration }}M '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🌐 ${{ env.PPE_URL }}"

      - name: Azure Logout
        if: always()
        run: az logout


