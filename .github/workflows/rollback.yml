name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to rollback to (e.g., v0.3.8). Leave empty to rollback to previous version.'
        required: false
        type: string

# Least-privilege default: read-only workflow token. The rollback job opts in to
# id-token: write below for Azure OIDC login.
permissions:
  contents: read

env:
  APP_NAME: azurerbac-builtinroles
  RESOURCE_GROUP: builtinroles
  ACR_NAME: azurerbacregistry
  ACR_LOGIN_SERVER: azurerbacregistry.azurecr.io
  IMAGE_NAME: rbaccatalog
  CONTAINERAPP_ENV: rbaccatalog-containerapp

jobs:
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest
    permissions:
      contents: read    # Check out the repository
      id-token: write   # Request the OIDC JWT for Azure login
    environment:
      name: production
      url: https://rbac-catalog.dev
    
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine rollback version
        id: target
        run: |
          git fetch --tags --force
          
          if [ -n "${{ inputs.version }}" ]; then
            # User specified a version
            TARGET="${{ inputs.version }}"
            echo "🎯 User specified version: $TARGET"
          else
            # Try to get current deployed version from live site
            CURRENT=$(curl -sf --max-time 10 https://rbac-catalog.dev/version | jq -r '.version // empty' 2>/dev/null | cut -d'-' -f1)
            
            if [ -z "$CURRENT" ]; then
              # Site is down or not responding - use latest tag
              echo "⚠️ Could not reach live site, using latest git tag"
              CURRENT=$(git tag --sort=-v:refname | head -1)
            fi
            
            echo "📡 Current version: $CURRENT"
            
            # Get the tag before the current one
            TARGET=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT}$" | tail -1)
            
            if [ -z "$TARGET" ] || [ "$TARGET" = "$CURRENT" ]; then
              echo "❌ Could not find previous version. Current: $CURRENT"
              echo "Available tags:"
              git tag --sort=-v:refname | head -10
              exit 1
            fi
            echo "⏪ Rolling back to previous version: $TARGET"
          fi
          
          # Validate format
          if [[ ! "$TARGET" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $TARGET. Expected: v0.0.0"
            exit 1
          fi
          
          echo "version=$TARGET" >> $GITHUB_OUTPUT
          echo "🔄 Target rollback version: $TARGET"

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check image exists in ACR
        run: |
          # Get the full version tag (includes SHA)
          FULL_VERSION=$(az acr repository show-tags \
            --name ${{ env.ACR_NAME }} \
            --repository ${{ env.IMAGE_NAME }} \
            --output tsv | grep "^${{ steps.target.outputs.version }}" | head -1)
          
          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Image not found for version ${{ steps.target.outputs.version }}"
            echo "Available versions:"
            az acr repository show-tags --name ${{ env.ACR_NAME }} --repository ${{ env.IMAGE_NAME }} --output tsv | head -20
            exit 1
          fi
          
          echo "IMAGE_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "✅ Found image: $FULL_VERSION"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: ${{ env.APP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}

      - name: Verify deployment health
        run: |
          echo "⏳ Waiting for deployment to be healthy with correct version..."
          MAX_WAIT=600
          WAITED=0
          EXPECTED_VERSION="${{ env.IMAGE_VERSION }}"
          while [ $WAITED -lt $MAX_WAIT ]; do
            RESPONSE=$(curl -sf --max-time 10 https://rbac-catalog.dev/version 2>/dev/null || echo "")
            if [ -n "$RESPONSE" ]; then
              DEPLOYED_VERSION=$(echo "$RESPONSE" | jq -r '.version // empty' 2>/dev/null)
              if [ "$DEPLOYED_VERSION" = "$EXPECTED_VERSION" ]; then
                echo "✅ Site is healthy with correct version after ${WAITED}s"
                echo "   Deployed: $DEPLOYED_VERSION"
                exit 0
              else
                echo "⏳ Version mismatch - expected: $EXPECTED_VERSION, got: $DEPLOYED_VERSION"
              fi
            fi
            sleep 30
            WAITED=$((WAITED + 30))
            echo "⏳ Waiting... ${WAITED}s / ${MAX_WAIT}s"
          done
          echo "⚠️ Health check timed out after ${MAX_WAIT}s (deployment may still be in progress)"

      # Re-pin this env's scan Jobs to the rollback image (scoped by the env's
      # resource ID + scan-name suffix). Best-effort: no Jobs yet -> skip.
      - name: Pin scan Jobs to rollback image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}"
          ENV_ID=$(az containerapp env show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.CONTAINERAPP_ENV }}" \
            --query id -o tsv)
          JOBS=$(az containerapp job list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.environmentId=='$ENV_ID' && (ends_with(name, '-role-scan') || ends_with(name, '-operations-scan'))].name" -o tsv)
          if [ -z "$JOBS" ]; then
            echo "⚠️ No scan Jobs (*-role-scan / *-operations-scan) found in env ${{ env.CONTAINERAPP_ENV }} — skipping pin"
            exit 0
          fi
          for JOB in $JOBS; do
            az containerapp job update \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "$JOB" \
              --image "$IMAGE" \
              --output none
            echo "📌 Pinned $JOB → $IMAGE"
          done

      - name: Azure Logout
        if: always()
        run: az logout

      - name: Rollback summary
        run: |
          echo "✅ Rollback complete!"
          echo "   Version: ${{ env.IMAGE_VERSION }}"
          echo "🌐 https://rbac-catalog.dev"
