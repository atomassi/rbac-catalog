# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Critical framework dependencies - review carefully
      python-frameworks:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "sqlalchemy"
          - "pydantic"
        update-types:
          - "minor"
          - "patch"
      # Azure SDK updates
      python-azure:
        patterns:
          - "azure-*"
        update-types:
          - "minor"
          - "patch"
      # OpenTelemetry/monitoring
      python-telemetry:
        patterns:
          - "opentelemetry-*"
          - "azure-monitor-*"
        update-types:
          - "minor"
          - "patch"
      # Database drivers and async
      python-database:
        patterns:
          - "asyncpg"
          - "aiosqlite"
          - "greenlet"
        update-types:
          - "minor"
          - "patch"
      # Testing dependencies
      python-testing:
        patterns:
          - "pytest"
          - "pytest-*"
        update-types:
          - "minor"
          - "patch"
      # ML/AI dependencies (PyTorch, transformers, embeddings)
      python-ml:
        patterns:
          - "torch"
          - "sentence-transformers"
          - "transformers"
          - "safetensors"
        update-types:
          - "minor"
          - "patch"
      # HTTP clients
      python-http:
        patterns:
          - "httpx"
          - "aiohttp"
        update-types:
          - "minor"
          - "patch"
      # Web utilities (templates, rate limiting, etc.)
      python-web:
        patterns:
          - "jinja2"
          - "python-multipart"
          - "slowapi"
        update-types:
          - "minor"
          - "patch"
      # All other minor/patch updates
      python-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major version updates are reviewed and applied manually for stability.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Pre-release versions (alpha/beta/rc) are opt-in only.
      - dependency-name: "*"
        update-types: ["version-update:semver-prerelease"]
      # opentelemetry-* sub-packages are exact-pinned by azure-monitor-opentelemetry;
      # bumping them independently breaks resolution (see #333, #335). Let
      # azure-monitor-opentelemetry drive the entire OpenTelemetry train.
      - dependency-name: "opentelemetry-*"
      # torch uses a platform split with a +cpu local tag on Linux only; Dependabot
      # rewrites the macOS line to torch==X+cpu (no such darwin wheel exists), which
      # breaks local installs (see #334). Bump torch manually.
      - dependency-name: "torch"

  # npm dependencies (for Playwright, Tailwind, etc.)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all npm dependencies together
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version updates for stability (review manually)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all GitHub Actions updates together
      github-actions:
        patterns:
          - "*"
    # Ignore major version updates for stability (review manually)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
