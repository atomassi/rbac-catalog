#cloud-config
# ============================================================================
# Cloud-init payload for the Ollama VM
# ============================================================================
# Baked into the VM at deploy time by modules/ollama-vm.bicep.
# Installs Ollama, exposes it on 0.0.0.0:11434 (NSG-protected), and pulls
# a base model. Load the fine-tuned model manually after first boot:
#     ssh azureuser@<vm-ip>
#     ollama pull qwen2.5:7b
#     ollama create qwen-rbac-v5 -f /opt/ollama/Modelfile.qwen-rbac-v5
# ============================================================================

package_update: true
package_upgrade: false

packages:
  - curl
  - jq
  - ufw

write_files:
  - path: /etc/systemd/system/ollama.service.d/override.conf
    permissions: '0644'
    content: |
      [Service]
      # Listen on all VNet interfaces — the NSG (modules/network.bicep)
      # restricts inbound 11434 to the App Service subnet only.
      Environment="OLLAMA_HOST=0.0.0.0:11434"
      Environment="OLLAMA_KEEP_ALIVE=24h"

  - path: /opt/ollama/Modelfile.qwen-rbac-v5
    permissions: '0644'
    content: |
      # Placeholder Modelfile for the fine-tuned qwen-rbac model.
      # Replace `qwen2.5:7b` and the system prompt with your fine-tune.
      FROM qwen2.5:7b
      PARAMETER temperature 0.1
      PARAMETER num_ctx 8192
      SYSTEM """
      You are an Azure RBAC role recommender. Given a description of required
      permissions, return the best matching built-in role(s) as JSON.
      """

runcmd:
  # 1. Install Ollama
  - [ bash, -lc, 'curl -fsSL https://ollama.com/install.sh | sh' ]

  # 2. Override systemd unit so Ollama listens on the VNet (not just 127.0.0.1)
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, --now, ollama ]
  - [ systemctl, restart, ollama ]

  # 3. Host firewall (defense in depth — the NSG already blocks everything else)
  - [ ufw, allow, "22/tcp" ]
  - [ ufw, allow, "11434/tcp" ]
  - [ ufw, --force, enable ]

  # 4. Pre-pull a sensible default base model
  - [ bash, -lc, 'sleep 10 && ollama pull qwen2.5:7b || true' ]

final_message: "Ollama installation complete. SSH in and run `ollama list`."
