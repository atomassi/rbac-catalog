name: Deploy

on:
  workflow_dispatch:  # Manual trigger only - restricted to main branch

# Only allow running on main branch
run-name: Deploy from ${{ github.ref_name }}

# Least-privilege default: the workflow token is read-only. Individual jobs opt
# in to the narrow write scopes they need (tag/release pushes, OIDC JWT) below.
permissions:
  contents: read

env:
  APP_NAME: azurerbac-builtinroles
  RESOURCE_GROUP: builtinroles
  ACR_NAME: azurerbacregistry
  ACR_LOGIN_SERVER: azurerbacregistry.azurecr.io
  IMAGE_NAME: rbaccatalog
  STAGING_URL: https://azurerbac-builtinroles-staging.azurewebsites.net
  CONTAINERAPP_ENV: rbaccatalog-containerapp

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 0: Validate branch - fail fast if not main
  # ═══════════════════════════════════════════════════════════════════════════
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy workflow can only be run from main branch, not ${{ github.ref_name }}"
          exit 1

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Create release tag and push image to ACR
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: validate-branch
    permissions:
      contents: write   # Push git tags and create the GitHub Release
      id-token: write   # Request the OIDC JWT for Azure login
    outputs:
      version: ${{ steps.version.outputs.version }}
      new_tag: ${{ steps.version.outputs.new_tag }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
    
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate version
        id: version
        run: |
          # Ensure all tags are fetched
          git fetch --tags --force
          # Get latest semver tag (works across all branches)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v0.0.0")
          MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          COMPUTED_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          # Check for base version override in .next-base-version file
          if [ -f ".next-base-version" ]; then
            BASE_VERSION=$(cat .next-base-version | tr -d '[:space:]')
            # Ensure it starts with 'v'
            [[ "$BASE_VERSION" != v* ]] && BASE_VERSION="v${BASE_VERSION}"
            
            # Compare versions: use base if it's greater than computed
            BASE_MAJOR=$(echo "$BASE_VERSION" | sed 's/^v//' | cut -d. -f1)
            BASE_MINOR=$(echo "$BASE_VERSION" | sed 's/^v//' | cut -d. -f2)
            BASE_PATCH=$(echo "$BASE_VERSION" | sed 's/^v//' | cut -d. -f3)
            
            # Compare: base > computed means use base
            if [ "$BASE_MAJOR" -gt "$MAJOR" ] || \
               ([ "$BASE_MAJOR" -eq "$MAJOR" ] && [ "$BASE_MINOR" -gt "$MINOR" ]) || \
               ([ "$BASE_MAJOR" -eq "$MAJOR" ] && [ "$BASE_MINOR" -eq "$MINOR" ] && [ "$BASE_PATCH" -gt "$NEW_PATCH" ]); then
              NEW_TAG="$BASE_VERSION"
              echo "📌 Using .next-base-version: $BASE_VERSION (computed was $COMPUTED_TAG)"
            else
              NEW_TAG="$COMPUTED_TAG"
            fi
          else
            NEW_TAG="$COMPUTED_TAG"
          fi
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${NEW_TAG}-${SHORT_SHA}"
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "📦 Version: $LATEST_TAG → $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" --no-merges | head -50)
          else
            # Get commits since last tag
            CHANGELOG=$(git log "${LATEST_TAG}"..HEAD --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" --no-merges)
          fi
          
          # Output multiline changelog
          {
            echo 'changelog<<EOL'
            echo "$CHANGELOG"
            echo 'EOL'
          } >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"
          echo "🏷️ Created tag: ${{ steps.version.outputs.new_tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.latest_tag }}...${{ steps.version.outputs.new_tag }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Azure Login using OIDC (federated identity)
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to ACR using Azure identity (more secure than username/password)
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          echo "🐳 Built and pushed: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

      - name: Azure Logout
        if: always()
        run: az logout

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Deploy to staging and run smoke tests
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read    # Check out the repository
      id-token: write   # Request the OIDC JWT for Azure login
    environment:
      name: staging
      url: https://azurerbac-builtinroles-staging.azurewebsites.net
    
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: staging
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}

      - name: Start staging slot
        run: |
          az webapp start --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging
          echo "🚀 Started staging slot with new image"

      - name: Get runner IP
        id: runner_ip
        run: |
          # Get both IPv4 and IPv6
          IPV4=$(curl -s -4 https://api.ipify.org || echo "")
          IPV6=$(curl -s -6 https://api64.ipify.org || echo "")
          echo "ipv4=$IPV4" >> $GITHUB_OUTPUT
          echo "ipv6=$IPV6" >> $GITHUB_OUTPUT
          echo "📍 Runner IPs - v4: ${IPV4:-none} | v6: ${IPV6:-none}"

      - name: Allow runner IP on staging
        run: |
          # Add IPv4 rule if available
          if [ -n "${{ steps.runner_ip.outputs.ipv4 }}" ]; then
            az webapp config access-restriction add \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --slot staging \
              --rule-name "GitHubRunner-v4" \
              --priority 50 \
              --ip-address ${{ steps.runner_ip.outputs.ipv4 }}/32 \
              --output none
            echo "✅ Added IPv4 ${{ steps.runner_ip.outputs.ipv4 }}"
          fi
          
          # Add IPv6 rule if available
          if [ -n "${{ steps.runner_ip.outputs.ipv6 }}" ]; then
            az webapp config access-restriction add \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --slot staging \
              --rule-name "GitHubRunner-v6" \
              --priority 51 \
              --ip-address ${{ steps.runner_ip.outputs.ipv6 }}/128 \
              --output none
            echo "✅ Added IPv6 ${{ steps.runner_ip.outputs.ipv6 }}"
          fi

      - name: Wait for staging to be ready
        run: |
          echo "⏳ Waiting for staging to be ready (up to 15 minutes)..."
          echo "   (AI models now warm up BEFORE startup, so healthz only returns 200 when ready)"
          MAX_WAIT_SECONDS=900
          POLL_INTERVAL_SECONDS=30
          WAITED_SECONDS=0
          
          while [ $WAITED_SECONDS -lt $MAX_WAIT_SECONDS ]; do
            if curl -sf "${{ env.STAGING_URL }}/healthz" > /dev/null 2>&1; then
              echo "✅ Staging is ready after ${WAITED_SECONDS}s"
              exit 0
            fi
            sleep $POLL_INTERVAL_SECONDS
            WAITED_SECONDS=$((WAITED_SECONDS + POLL_INTERVAL_SECONDS))
            echo "⏳ Waiting... ${WAITED_SECONDS}s / ${MAX_WAIT_SECONDS}s"
          done
          
          echo "❌ Staging not ready after ${MAX_WAIT_SECONDS}s"
          exit 1

      - name: Smoke tests on staging
        run: |
          pip install httpx==0.28.1
          python scripts/smoke_tests.py --url ${{ env.STAGING_URL }} --verbose

      - name: Remove runner IP from staging
        if: always()
        run: |
          az webapp config access-restriction remove \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot staging \
            --rule-name "GitHubRunner-v4" \
            --output none || true
          az webapp config access-restriction remove \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot staging \
            --rule-name "GitHubRunner-v6" \
            --output none || true
          echo "🧹 Removed runner IPs from staging allowlist"

      - name: Azure Logout
        if: always()
        run: az logout

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 3: Swap to production
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    permissions:
      id-token: write   # Request the OIDC JWT for Azure login
    environment:
      name: production
      url: https://rbac-catalog.dev
    
    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Staging slot is already running from deploy-staging
      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production
          echo "🔄 Swapped staging to production"

      # Pin this environment's scan Jobs to the just-released image so they don't
      # drift onto the mutable :latest tag on their next cron tick. Scope by the
      # environment's full resource ID (exact match, so a second Container Apps
      # environment in the same RG is never touched) and the stable scan-name
      # suffixes. Best-effort: no Jobs yet -> warn and continue.
      - name: Pin scan Jobs to released image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.version }}"
          ENV_ID=$(az containerapp env show \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.CONTAINERAPP_ENV }}" \
            --query id -o tsv)
          JOBS=$(az containerapp job list \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "[?properties.environmentId=='$ENV_ID' && (ends_with(name, '-role-scan') || ends_with(name, '-operations-scan'))].name" -o tsv)
          if [ -z "$JOBS" ]; then
            echo "⚠️ No scan Jobs (*-role-scan / *-operations-scan) found in env ${{ env.CONTAINERAPP_ENV }} — skipping pin"
            exit 0
          fi
          for JOB in $JOBS; do
            az containerapp job update \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "$JOB" \
              --image "$IMAGE" \
              --output none
            echo "📌 Pinned $JOB → $IMAGE"
          done

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          INDEXNOW_KEY="${{ secrets.INDEXNOW_KEY }}"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"rbac-catalog.dev\",
              \"key\": \"$INDEXNOW_KEY\",
              \"keyLocation\": \"https://rbac-catalog.dev/$INDEXNOW_KEY.txt\",
              \"urlList\": [
                \"https://rbac-catalog.dev/roles\",
                \"https://rbac-catalog.dev/operations\",
                \"https://rbac-catalog.dev/recommend\",
                \"https://rbac-catalog.dev/about\",
                \"https://rbac-catalog.dev/recent\"
              ]
            }")

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 202 ]; then
            echo "✅ IndexNow notified (HTTP $RESPONSE)"
          else
            echo "⚠️ IndexNow returned HTTP $RESPONSE"
            exit 1
          fi

      - name: Azure Logout
        if: always()
        run: az logout

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Deployment complete!"
          echo "   Version: ${{ needs.build-and-push.outputs.version }}"
          echo "   Tag: ${{ needs.build-and-push.outputs.new_tag }}"
          echo "🌐 https://rbac-catalog.dev"

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 4: Always stop staging slot after deployment completes
  # ═══════════════════════════════════════════════════════════════════════════
  # Single place to stop staging - runs after all other jobs regardless of outcome
  cleanup-staging:
    name: Stop Staging Slot
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && needs.deploy-staging.result != 'skipped'
    permissions:
      id-token: write   # Request the OIDC JWT for Azure login
    
    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop staging slot
        run: |
          az webapp stop --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging || true
          echo "🛑 Stopped staging slot"
          echo "   deploy-staging: ${{ needs.deploy-staging.result }}"
          echo "   deploy-production: ${{ needs.deploy-production.result }}"

      - name: Azure Logout
        if: always()
        run: az logout
