name: Build

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check azurerbac/
      - run: ruff format --check azurerbac/

  typecheck:
    name: Static Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: pip install -r requirements.txt pyright
      - run: pyright azurerbac/
      - run: npm ci
      - run: npm run check:js

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        id: tests
        run: |
          pytest tests/ -q --tb=short --cov=azurerbac --cov-report=term --cov-fail-under=50 2>&1 | tee coverage.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          COVERAGE=$(grep -E '^TOTAL' coverage.txt | awk '{print $(NF)}' | tr -d '%')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          exit $PYTEST_EXIT
        env:
          DB_CONNECTION_STRING: "sqlite+aiosqlite:///:memory:"

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483  # v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 56d5c381b196c9c18db9fedbecb79220
          filename: coverage.json
          label: coverage
          message: ${{ steps.tests.outputs.coverage }}%
          valColorRange: ${{ steps.tests.outputs.coverage }}
          minColorRange: 50
          maxColorRange: 90

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1

      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548  # v6.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Seed test data
        run: python e2e/seed_data.py
        env:
          DB_CONNECTION_STRING: "sqlite+aiosqlite:///e2e_test.db"

      - name: Run E2E tests
        run: |
          uvicorn azurerbac.web.app:app --host 0.0.0.0 --port 8000 &
          for i in {1..30}; do curl -s http://localhost:8000/healthz && break || sleep 1; done
          npm run test:e2e
        env:
          DB_CONNECTION_STRING: "sqlite+aiosqlite:///e2e_test.db"

      - name: Upload test report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
