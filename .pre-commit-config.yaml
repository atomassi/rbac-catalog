# Pre-commit hooks configuration
# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--no-fix]
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
        args: [rbaccatalog/]

      - id: unit-tests
        name: unit tests
        entry: ./scripts/run_tests_precommit.sh unit
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: e2e-tests
        name: e2e tests
        entry: ./scripts/run_tests_precommit.sh e2e
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]
