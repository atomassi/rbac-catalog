<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Prevent dark mode flash -->
  <script>
  (function() {
      var stored = localStorage.getItem('darkMode');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var hour = new Date().getHours();
      var isNight = hour >= 19 || hour < 7;
      if (stored === 'true' || (stored === null && (prefersDark || isNight))) {
          document.documentElement.classList.add('dark');
      }
  })();
  </script>
  <title>Bad Request - Azure RBAC Built-in Role Definitions Monitor</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
</head>
<body class="bg-gray-100 dark:bg-slate-900 min-h-screen flex items-center justify-center transition-colors duration-200">
  <div class="text-center max-w-lg mx-auto px-4">
    <h1 class="text-6xl font-bold text-gray-800 dark:text-gray-100 mb-4">400</h1>
    <h2 class="text-2xl font-semibold text-gray-600 dark:text-gray-300 mb-4">Bad Request</h2>
    <p class="text-gray-500 dark:text-gray-400 mb-6">The request contains invalid parameters.</p>
    
    {% if errors %}
    <div class="bg-white dark:bg-slate-800 rounded-lg shadow p-4 mb-8 text-left">
      <h3 class="font-medium text-gray-700 dark:text-gray-200 mb-2">Details:</h3>
      <ul class="text-sm text-gray-600 dark:text-gray-300 space-y-1">
        {% for error in errors %}
        <li class="flex items-start">
          <span class="text-red-500 mr-2">•</span>
          <span><strong>{{ error.loc[-1] }}</strong>: {{ error.msg }}</span>
        </li>
        {% endfor %}
      </ul>
    </div>
    {% endif %}
    
    <a href="/" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
      Back to Home
    </a>
  </div>
  
  <!-- Dark mode handler -->
  <script src="/static/js/darkmode.js"></script>
</body>
</html>
