name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN. The e2e job's artifact upload uses
# the separate ACTIONS_RUNTIME_TOKEN, so contents: read is sufficient here.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.14.10
      - run: ruff check rbaccatalog/
      - run: ruff format --check rbaccatalog/

  typecheck:
    name: Static Type Check
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: pip install -r requirements.txt pyright==1.1.407
      - run: pyright rbaccatalog/
      - run: npm ci
      - run: npm run check:js

  test-js:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: ${{ github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20.19.0'  # Pin for Vite 7.3.1 compatibility
          cache: 'npm'
      - run: npm ci
      - run: npm run test:js

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: ${{ github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q --tb=short --cov=rbaccatalog --cov-report=term --cov-report=xml --cov-fail-under=80
        env:
          DB_CONNECTION_STRING: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: ${{ github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Seed test data
        run: python e2e/seed_data.py
        env:
          DB_CONNECTION_STRING: "sqlite+aiosqlite:///e2e_test.db"

      - name: Run E2E tests
        run: |
          uvicorn rbaccatalog.web.app:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for app to start..."
          for i in {1..600}; do
            if curl -sf http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "App ready after ${i}s"
              break
            fi
            sleep 10
          done
          curl -sf http://localhost:8000/healthz || { echo "App failed to start"; exit 1; }
          npm run test:e2e
        env:
          DB_CONNECTION_STRING: "sqlite+aiosqlite:///e2e_test.db"

      - name: Upload test report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
