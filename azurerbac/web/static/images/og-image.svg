<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005A9E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shield-gradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#50E6FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004578;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shield-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
    <filter id="shield-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Subtle pattern overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Modern Shield Icon -->
  <g transform="translate(100, 165)" filter="url(#shield-shadow)">
    <!-- Shield outer shape -->
    <path d="M100 8 C70 15 45 20 45 20 C45 20 42 80 45 110 C52 160 100 200 100 200 C100 200 148 160 155 110 C158 80 155 20 155 20 C155 20 130 15 100 8 Z" 
          fill="url(#shield-gradient)"/>
    <!-- Shield inner highlight -->
    <path d="M100 18 C75 24 55 28 55 28 C55 28 53 75 55 100 C60 140 100 175 100 175 C100 175 140 140 145 100 C147 75 145 28 145 28 C145 28 125 24 100 18 Z" 
          fill="url(#shield-inner)"/>
    <!-- Checkmark -->
    <g filter="url(#glow)">
      <path d="M75 100 L92 120 L130 75" 
            stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
  
  <!-- Main Title -->
  <text x="280" y="265" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="white">
    Azure Built-in Roles
  </text>
  
  <!-- Subtitle -->
  <text x="280" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="400" fill="rgba(255,255,255,0.9)">
    RBAC Role Definitions Monitor
  </text>
  
  <!-- Features -->
  <g transform="translate(280, 420)" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">
    <text x="0" y="0">✓ Complete role list</text>
    <text x="280" y="0">✓ Permission details</text>
    <text x="560" y="0">✓ Change tracking</text>
  </g>
  
  <g transform="translate(280, 470)" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">
    <text x="0" y="0">✓ JSON definitions</text>
    <text x="280" y="0">✓ Role recommender</text>
    <text x="560" y="0">✓ Updated daily</text>
  </g>
</svg>
