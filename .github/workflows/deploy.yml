name: Deploy

on:
  workflow_dispatch:  # Manual trigger
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [release]

# Required permissions for OIDC authentication
permissions:
  id-token: write   # Required for requesting the JWT
  contents: write   # Required for pushing git tags

env:
  APP_NAME: azurerbac-builtinroles
  RESOURCE_GROUP: builtinroles
  ACR_NAME: azurerbacregistry
  ACR_LOGIN_SERVER: azurerbacregistry.azurecr.io
  IMAGE_NAME: azurerbac
  STAGING_URL: https://azurerbac-builtinroles-staging.azurewebsites.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate version
        id: version
        run: |
          # Ensure all tags are fetched
          git fetch --tags --force
          # Get latest semver tag (works across all branches)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "v0.0.0")
          MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          VERSION="${NEW_TAG}-${SHORT_SHA}"
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "📦 Version: $LATEST_TAG → $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG="${{ steps.version.outputs.latest_tag }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" --no-merges | head -50)
          else
            # Get commits since last tag
            CHANGELOG=$(git log "${LATEST_TAG}"..HEAD --pretty=format:"- %s ([%h](${REPO_URL}/commit/%H))" --no-merges)
          fi
          
          # Output multiline changelog
          {
            echo 'changelog<<EOL'
            echo "$CHANGELOG"
            echo 'EOL'
          } >> $GITHUB_OUTPUT

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.new_tag }}" -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin "${{ steps.version.outputs.new_tag }}"
          echo "🏷️ Created tag: ${{ steps.version.outputs.new_tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b  # v2.2.2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: |
            ## What's Changed
            
            ${{ steps.changelog.outputs.changelog }}
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.latest_tag }}...${{ steps.version.outputs.new_tag }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Azure Login using OIDC (federated identity - no secrets stored)
      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to ACR using Azure identity (more secure than username/password)
      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build \
            --build-arg VERSION="${{ steps.version.outputs.version }}" \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          echo "🐳 Built and pushed: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

      # Deploy to staging slot first
      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@2fdd5c3ebb4e540834e86ecc1f6fdcd5539023ee  # v3.0.2
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: staging
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      # Start staging slot with the new image
      - name: Start staging slot
        run: |
          az webapp start --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging
          echo "🚀 Started staging slot with new image"

      # Wait for staging to be ready
      - name: Wait for staging to start
        run: sleep 120

      # Run smoke tests against staging
      - name: Smoke tests on staging
        run: |
          pip install httpx
          python scripts/smoke_tests.py --url ${{ env.STAGING_URL }}

      # Swap staging with production
      - name: Swap staging to production
        run: |
          az webapp deployment slot swap \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot staging \
            --target-slot production
          echo "🔄 Swapped staging to production"

      # Stop staging slot to save costs
      - name: Stop staging slot
        if: always()
        run: |
          az webapp stop --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot staging
          echo "🛑 Stopped staging slot"

      - name: Azure Logout
        if: always()
        run: az logout

      - name: Deployment summary
        run: |
          echo "✅ Deployment complete!"
          echo "   Version: ${{ steps.version.outputs.version }}"
          echo "   Tag: ${{ steps.version.outputs.new_tag }}"
          echo "🌐 https://rbac-catalog.dev"
