name: Deploy PPE

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string
      duration:
        description: 'Duration to keep environment running (minutes, max 90)'
        required: true
        default: '30'
        type: choice
        options:
          - '30'
          - '60'
          - '90'

run-name: PPE Deploy - ${{ inputs.branch }} (${{ inputs.duration }}m)

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: azurerbac-builtinroles
  RESOURCE_GROUP: builtinroles
  ACR_NAME: azurerbacregistry
  ACR_LOGIN_SERVER: azurerbacregistry.azurecr.io
  IMAGE_NAME: azurerbac
  PPE_SLOT: ppe
  PPE_URL: https://azurerbac-builtinroles-ppe.azurewebsites.net

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: Build and deploy to PPE
  # ═══════════════════════════════════════════════════════════════════════════
  # Note: PPE slot inherits IP restrictions from production (Cloudflare + LocalDev IPs).
  # Auto-shutdown is handled by Azure Automation Runbook (scripts/ppe-auto-shutdown.ps1)
  # running hourly via schedule "Hourly-PPE-Shutdown-Check".
  deploy-ppe:
    name: Deploy to PPE
    runs-on: ubuntu-latest
    environment:
      name: ppe
      url: ${{ env.PPE_URL }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
      - name: Validate duration
        run: |
          # Defensive check - choice options limit this, but API calls could bypass UI
          DURATION="${{ inputs.duration }}"
          if ! [[ "$DURATION" =~ ^[0-9]+$ ]]; then
            echo "::error::Duration must be a number"
            exit 1
          fi
          if [ "$DURATION" -lt 10 ]; then
            echo "::error::Duration must be at least 10 minutes"
            exit 1
          fi
          if [ "$DURATION" -gt 90 ]; then
            echo "::error::Duration cannot exceed 90 minutes"
            exit 1
          fi
          echo "✅ Duration validated: ${DURATION} minutes"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Sanitize branch name for Docker tag (replace invalid chars with hyphen)
          BRANCH_SAFE=$(echo "${{ inputs.branch }}" | sed 's/[^a-zA-Z0-9]/-/g' | cut -c1-20)
          VERSION="ppe-${BRANCH_SAFE}-${SHORT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 PPE Version: $VERSION"

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          IMAGE_REF="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "🐳 Building: ${IMAGE_REF}"
          docker build --build-arg VERSION="${{ steps.version.outputs.version }}" -t "${IMAGE_REF}" .
          echo "📤 Pushing: ${IMAGE_REF}"
          docker push "${IMAGE_REF}"
          echo "✅ Built and pushed: ${IMAGE_REF}"

      - name: Deploy to PPE Slot
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.PPE_SLOT }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}

      - name: Start PPE slot
        run: |
          az webapp start --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --slot ${{ env.PPE_SLOT }}
          echo "🚀 Started PPE slot with image: ${{ steps.version.outputs.version }}"

      - name: Set auto-shutdown timestamp
        id: shutdown
        run: |
          DURATION="${{ inputs.duration }}"
          SHUTDOWN_AT=$(date -u -d "+${DURATION} minutes" +%s)
          SHUTDOWN_AT_HUMAN=$(date -u -d "@${SHUTDOWN_AT}" '+%Y-%m-%d %H:%M:%S UTC')
          
          az webapp config appsettings set \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --slot ${{ env.PPE_SLOT }} \
            --settings PPE_SHUTDOWN_AT=$SHUTDOWN_AT \
            --output none

          echo "shutdown_time=${SHUTDOWN_AT_HUMAN}" >> $GITHUB_OUTPUT
          echo "⏰ Auto-shutdown scheduled at: ${SHUTDOWN_AT_HUMAN}"

      - name: Wait for PPE to be ready
        run: |
          echo "⏳ Waiting for PPE to be ready (up to 15 minutes)..."
          MAX_WAIT_SECONDS=900
          POLL_INTERVAL_SECONDS=30
          WAITED_SECONDS=0
          
          while [ $WAITED_SECONDS -le $MAX_WAIT_SECONDS ]; do
            HTTP_CODE=$(curl -f -o /dev/null -w "%{http_code}" "${{ env.PPE_URL }}/healthz" 2>/dev/null || echo "CONN_ERR")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ PPE is ready after ${WAITED_SECONDS}s"
              exit 0
            fi
            echo "⏳ Waiting... ${WAITED_SECONDS}s/${MAX_WAIT_SECONDS}s (status: $HTTP_CODE)"
            sleep $POLL_INTERVAL_SECONDS
            WAITED_SECONDS=$((WAITED_SECONDS + POLL_INTERVAL_SECONDS))
          done
          
          echo "❌ PPE not ready after ${MAX_WAIT_SECONDS}s"
          exit 1

      - name: PPE deployment summary
        run: |
          echo "✅ PPE deployment complete!"
          echo "   Branch: ${{ inputs.branch }}"
          echo "   Version: ${{ steps.version.outputs.version }}"
          echo "   Duration: ${{ inputs.duration }} minutes"
          echo "   Auto-shutdown at: ${{ steps.shutdown.outputs.shutdown_time }}"
          echo "🌐 ${{ env.PPE_URL }}"

      - name: Azure Logout
        if: always()
        run: az logout


